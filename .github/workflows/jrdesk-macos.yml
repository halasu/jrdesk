name: JRDesk macOS build

# Trimmed copy of the upstream build-for-macOS job (Apple Silicon only, unsigned / ad-hoc signed).
on:
  workflow_dispatch:

env:
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VERSION: "1.5.3"
  APP: "JRDesk"
  BUNDLE_ID: "cloud.jrdesk.JRDesk"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-for-macOS:
    name: aarch64-apple-darwin
    runs-on: macos-15
    needs: [generate-bridge]
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg gnu-sed
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Apply JRDesk branding
        shell: bash
        run: |
          # The branding script uses GNU `sed -i`; Pillow goes into a venv (PEP 668 on brew python).
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          python3 -m venv "$RUNNER_TEMP/jrdesk-venv"
          source "$RUNNER_TEMP/jrdesk-venv/bin/activate"
          bash res/jrdesk/jrdesk-branding.sh

          # macOS code expects /Applications/<APP_NAME>.app/Contents/MacOS/<APP_NAME>
          sed -i -E "s|^PRODUCT_NAME = .*|PRODUCT_NAME = ${APP}|; s|^PRODUCT_BUNDLE_IDENTIFIER = .*|PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}|" flutter/macos/Runner/Configs/AppInfo.xcconfig
          sed -i "s|RustDesk\.app|${APP}.app|g" flutter/macos/Runner.xcodeproj/project.pbxproj build.py
          cat flutter/macos/Runner/Configs/AppInfo.xcconfig
          grep -n "${APP}.app" build.py flutter/macos/Runner.xcodeproj/project.pbxproj

          # App icon (.icns) from the generated PNG set
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$ICONSET"
          SRC=res/jrdesk/out/icon-512.png
          for s in 16 32 128 256 512; do
            sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o flutter/macos/Runner/AppIcon.icns
          ls -la flutter/macos/Runner/AppIcon.icns

      - name: Install NASM
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_MACOS_ARM_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        run: flutter config --no-enable-swift-package-manager

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        shell: bash
        run: |
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-15-jrdesk

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact-flutter-3.44
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Ad-hoc sign and create dmg
        run: |
          APP_PATH="./flutter/build/macos/Build/Products/Release/${APP}.app"
          ls -la "./flutter/build/macos/Build/Products/Release/"
          test -f "${APP_PATH}/Contents/MacOS/${APP}"
          test -f "${APP_PATH}/Contents/MacOS/service"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" -c "Print :CFBundleIdentifier" -c "Print :CFBundleExecutable" "${APP_PATH}/Contents/Info.plist"
          # No Developer ID: ad-hoc sign so the bundle seal is valid on Apple Silicon.
          codesign --force --deep -s - "${APP_PATH}"
          codesign --verify --deep --strict -vv "${APP_PATH}"
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "${APP}.app" 200 190 --hide-extension "${APP}.app" --window-size 800 400 --app-drop-link 600 185 "${APP}-${VERSION}-aarch64.dmg" "${APP_PATH}"
          shasum -a 256 "${APP}-${VERSION}-aarch64.dmg"

      - name: Upload JRDesk macOS dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jrdesk-macos-aarch64
          path: JRDesk-*.dmg # the dmg keeps the bundle's link structure intact
          if-no-files-found: error
